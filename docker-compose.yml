services:
  postgres:
    image: postgres:16-alpine
    container_name: hardstuck-postgres
    ports:
      # Host 5434 — avoid clinic_postgres (5433) and other local Postgres (5432)
      - "5434:5432"
    environment:
      POSTGRES_USER: hardstuck
      POSTGRES_PASSWORD: hardstuck
      POSTGRES_DB: hardstuck
    volumes:
      - hardstuck_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardstuck -d hardstuck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hardstuck-redis
    ports:
      # Host 6380 — 6379 often taken by other local Redis (e.g. clinic_redis)
      - "6380:6379"
    volumes:
      - hardstuck_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  hardstuck_pg_data:
  hardstuck_redis_data:
